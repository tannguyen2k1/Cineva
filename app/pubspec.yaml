name: cineva
description: Cineva mobile app — Flutter client for the Cineva API
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  cached_network_image: ^4.0.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  go_router: ^18.0.1
  google_fonts: ^8.2.1
  http: ^1.6.0
  intl: ^0.20.3
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  video_player: ^2.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/cineva-mark.svg
    - assets/brand/cineva-mark.png
    - assets/brand/cineva-logo.png
