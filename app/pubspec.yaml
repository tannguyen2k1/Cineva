name: cineva
description: Cineva mobile app — Flutter client for the Cineva API
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  cached_network_image: ^4.0.0
  flutter_cache_manager: ^3.4.1
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  go_router: ^18.0.1
  google_fonts: ^8.2.1
  http: ^1.6.0
  http_parser: ^4.1.2
  image_picker: ^1.2.3
  intl: ^0.20.3
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1
  webview_flutter_wkwebview: ^3.26.1
  wakelock_plus: ^1.8.0
  window_manager: ^0.4.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.1

flutter_native_splash:
  color: "#09090B"
  image: "assets/brand/cineva-mark.png"
  android_12:
    image: "assets/brand/cineva-mark.png"
    icon_background_color: "#09090B"

flutter:
  uses-material-design: true
  assets:
    - assets/brand/cineva-mark.svg
    - assets/brand/cineva-18-mark.svg
    - assets/brand/cineva-mark.png
    - assets/brand/cineva-logo.png
    - assets/brand/film-poster-placeholder.png
