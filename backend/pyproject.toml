[project]
name = "admin-pro-api"
version = "1.0.0"
description = "Multi-tenant SaaS REST API (FastAPI)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "alembic>=1.14.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "bcrypt>=4.0.0,<4.1",
  "python-multipart>=0.0.17",
  "httpx>=0.28.0",
  "psutil>=6.1.0",
  "scalar-fastapi>=1.2.0",
  "email-validator>=2.2.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
